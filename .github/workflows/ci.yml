name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # 与 package.json 的 packageManager 字段保持一致
          version: 10.34.5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # 生产检索链路的端到端评测：只有这里会真正跑 pgvector 的 `<=>` 排序、
  # HNSW 索引与 `vector(384)` 维度约束，以及真实 embedding 模型。
  # 单元测试用的是内存替身，无法覆盖驱动返回结构这类缺陷。
  retrieval-eval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cloudsage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cloudsage?schema=public
      # 打开真实数据库集成测试（级联删除、唯一约束、vector 维度约束、HNSW 索引、
      # 事务回滚、并发条件更新）。这些语义只在数据库层成立，内存替身覆盖不到。
      RUN_DB_INTEGRATION: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 本地 embedding 模型（Xenova multilingual MiniLM）体积较大，缓存起来
      # 避免每次 CI 都重新下载。
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('services/chat/src/llm/embedding/model.ts') }}

      - name: Apply migrations
        run: pnpm --filter @cloudsage/chat db:deploy

      - name: Database integration tests
        run: pnpm --filter @cloudsage/chat exec vitest run test/database-integration.spec.ts

      - name: Retrieval eval (production path)
        run: pnpm --filter @cloudsage/chat eval:retrieval
