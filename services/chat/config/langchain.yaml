llm:
  model: deepseek-v4-pro
  modelTiers:
    high: deepseek-v4-pro
    medium: deepseek-v4-flash
    compressor: deepseek-v4-flash
  reasoningEffort: high
  temperature: 0
  maxTokens: 1024
  timeoutMs: 30000
  maxRetries: 2
  batchSize: 2
  maxConcurrency: 2

retrieval:
  enabled: true
  topK: 3
  minScore: 0.35
  mode: hybrid
  timeoutMs: 8000

tools:
  enabled: false
  allowList: []

features:
  streaming: true
  batch: true
