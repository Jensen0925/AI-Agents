name: cloudsage

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cloudsage
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloudsage"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  api:
    build:
      context: ../..
      dockerfile: services/chat/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cloudsage
      JWT_SECRET: ${JWT_SECRET:-cloudsage-local-access-secret-change-me}
      CORS_ORIGINS: http://localhost:3002,http://localhost:3003
      PORT: 3001
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@cloudsage.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Cloudsage@123}
    ports:
      - "3001:3001"
    volumes:
      - api_uploads:/workspace/services/chat/uploads
    healthcheck:
      test: ["CMD", "bun", "-e", "const response = await fetch('http://127.0.0.1:3001/health'); if (!response.ok) process.exit(1);"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: clients/chat-web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://api:3001
    environment:
      NODE_ENV: production
      PORT: 3002
    ports:
      - "3002:3002"
    depends_on:
      api:
        condition: service_healthy

  admin-web:
    build:
      context: ../..
      dockerfile: clients/admin-web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://api:3001
    environment:
      NODE_ENV: production
      PORT: 3003
    ports:
      - "3003:3003"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  api_uploads:
