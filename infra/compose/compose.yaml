name: cloudsage

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cloudsage
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d cloudsage
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  chat:
    build:
      context: ../..
      dockerfile: services/chat/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cloudsage
      PORT: 4001
    ports:
      - "4001:4001"
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "const response = await fetch('http://127.0.0.1:4001/health'); if (!response.ok) process.exit(1);"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy

  chat-web:
    build:
      context: ../..
      dockerfile: clients/chat-web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://chat:4001
    environment:
      PORT: 3002
    ports:
      - "3002:3002"
    depends_on:
      chat:
        condition: service_healthy

volumes:
  postgres_data:
